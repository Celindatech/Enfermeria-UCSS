<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enfermería UCSS</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>
  <h1>Enfermería - UCSS</h1>

  <!-- Contenedor del mensaje de egreso -->
  <div id="egreso"></div>

  <!-- Botón de reinicio -->
  <button id="reiniciar" class="boton-reiniciar">🔄 Reiniciar malla</button>

  <!-- Contenedor donde JS dibujará toda la malla curricular -->
  <div id="malla" class="contenedor-malla"></div>

  <!-- Barra inferior de resumen con contadores dinámicos -->
  <div class="summary-bar">
    Créditos: <span id="creditos-acumulados">0</span>/226 | 
    Electivos aprobados: <span id="electivos-acumulados">0</span>/2
  </div>

  <!-- Librería de confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Script principal -->
  <script src="main.js"></script>
</body>
</html>
